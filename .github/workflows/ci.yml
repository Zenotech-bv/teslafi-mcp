name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 4 (and its vite dependency) require Node >= 20, so the full
        # build + test cycle runs on 20 and 22. Node 18 — the oldest runtime
        # the built server supports — gets a build-only job below.
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Audit (non-blocking)
        run: npm audit
        continue-on-error: true

  build-node18:
    # The runtime target is Node >= 18 (package.json / manifest.json), but the
    # vitest toolchain needs Node >= 20. Verify the build still compiles on 18
    # without running the test suite.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
